<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Your Order</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="page">


    <div class="brand">
        <div class="brand-badge">📦</div>
    </div>


    <h1>
        Track Your Order
    </h1>


    <p class="subtitle">
        Enter your Twitter / X Account 
    </p>



    <!-- Step 1: Username -->

    <div class="search-box" id="stepUsername">

        <div class="search-row">

            <input
                type="text"
                id="username"
                placeholder="@username"
            >

            <button onclick="checkUsername()">
                Next 🔍
            </button>

        </div>

    </div>

    <p id="usernameError" class="field-error hidden">
        ❌ ไม่พบชื่อผู้ใช้งานนี้ ลองตรวจสอบอีกครั้ง
    </p>


    <!-- Step 2: Phone (revealed after username is found) -->

    <div class="search-box hidden" id="stepPhone">

        <div class="found-user">

            <span>✅<b id="confirmedUsername"></b></span>

        </div>

        <div class="search-row">

            <input
                type="text"
                id="phoneLast4"
                placeholder="last 4 digits of your phone"
                maxlength="4"
                inputmode="numeric"
                pattern="[0-9]*"
            >

            <button onclick="searchTracking()">
                Search 🔍
            </button>

        </div>

    </div>



    <!-- Loading -->

    <div id="loading" class="hidden">

        <div class="loading-backdrop"></div>

        <div class="loading-card">

            <div class="spinner-wrap">
                <div class="spinner"></div>
            </div>

            <h3 id="loadingText">
                ⏳ Searching...
            </h3>

            <p>
                Please wait while we check your order
            </p>

        </div>

    </div>




    <!-- Result -->

    <div id="result" class="hidden">


        <div class="card">


            <h3>
                📮 Tracking Number
            </h3>


            <div class="tracking-box">


                <span id="tracking">
                    
                </span>


                <button 
                    id="copyBtn"
                    onclick="copyTracking()">

                    📋 Copy

                </button>


            </div>



            <h3>
                🚚 Current Status
            </h3>


            <div class="status-box">

                <p id="status"></p>

                <p id="update"></p>

            </div>



        </div>





        <div class="card">


            <h3>
                📍 Tracking History
            </h3>


            <div id="timeline">


            </div>


        </div>



    </div>


    <p class="footer-note">
        Powered by puaychi
    </p>


</div>




<script src="script.js"></script>


</body>

</html>
